name: hn_take_away
description: "HNS Take Away — Kişisel Hacker News özetleyiciniz için günlük AI-özetli makaleleri çevrimdışı olarak yanınıza almanızı sağlayan mobil uygulama."
publish_to: 'none'
version: 0.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Database
  sqflite: ^2.4.1
  path_provider: ^2.1.4
  path: ^1.9.0

  # Network
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  connectivity_plus: ^6.1.0

  # Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_slidable: ^3.1.1

  # Notifications
  flutter_local_notifications: ^18.0.1

  # QR Code Scanning
  mobile_scanner: ^5.2.3

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  device_info_plus: ^10.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/locales/en.json
    - assets/locales/tr.json
