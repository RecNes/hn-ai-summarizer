when:
  event: [push, pull_request]
  branch: [main, master]

steps:
  notify-start:
    name: Send Build Start Notification
    image: appleboy/drone-telegram
    settings:
      token:
        from_secret: TELEGRAM_TOKEN
      to:
        from_secret: TELEGRAM_USERID
      format: markdown
      message: |
        👷‍♂️ *Woodpecker Builder*
        
        `${CI_REPO_NAME}/${CI_COMMIT_BRANCH}` branch'i için *#${CI_PIPELINE_NUMBER}* numaralı deployment başlatıldı... 
        
        👤 Commit Author: _${CI_COMMIT_AUTHOR}_
        📖 Commit Mesajı:
        ```
        ${CI_COMMIT_MESSAGE}
        ```
        [🔗 Detaylar](${CI_PIPELINE_URL})

  determine-version:
    image: docker:27-cli
    commands:
      - apk add --no-cache git bash
      - git fetch --tags --force
      - bash scripts/version.sh
      - cat .env_versions
    when:
      event: [push]
      branch: [main, master]

  create-tag:
    image: docker:27-cli
    commands:
      - apk add --no-cache git bash openssh-client
      - cat .env_versions
      - bash scripts/create-tag.sh
    when:
      event: [push]
      branch: [main, master]
      status: [success]

  build-and-push:
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DOCKER_REGISTRY:
        from_secret: DOCKER_REGISTRY
    commands:
      - |
        . .env_versions 2>/dev/null || export APP_VERSION="${CI_COMMIT_SHA:0:8}"
        APP_VERSION="${APP_VERSION:-${CI_COMMIT_SHA:0:8}}"
        echo "Building Docker image with version: $APP_VERSION"
        docker build --build-arg APP_VERSION="$APP_VERSION" \
          -t "$DOCKER_REGISTRY/nunti:$APP_VERSION" \
          -t "$DOCKER_REGISTRY/nunti:latest" .
        echo "Docker Image: $DOCKER_REGISTRY/nunti:$APP_VERSION"
        docker push "$DOCKER_REGISTRY/nunti:$APP_VERSION"
        docker push "$DOCKER_REGISTRY/nunti:latest"
    when:
      event: [push]
      branch: [main, master]

  test:
    image: ghcr.io/astral-sh/uv:latest
    commands:
      - uv pip install --system -e ".[dev]"
      - uv run pytest tests/ -v --tb=short
    when:
      event: [pull_request]

  deploy:
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      NUNTI_ENV_FILE:
        from_secret: NUNTI_ENV_FILE
      DOCKER_REGISTRY:
        from_secret: DOCKER_REGISTRY
    commands:
      - |
        . .env_versions 2>/dev/null || true
        printf '%s' "$NUNTI_ENV_FILE" > /tmp/.env
        cp /tmp/.env .env 2>/dev/null || true
        docker compose --env-file /tmp/.env pull
        docker compose --env-file /tmp/.env up -d --remove-orphans --no-build
        docker image prune -af
    when:
      event: [push]
      branch: [main, master]
      status: [success]

  notify-success:
    name: Send Build Success Notification
    image: appleboy/drone-telegram
    settings:
      token:
        from_secret: TELEGRAM_TOKEN
      to:
        from_secret: TELEGRAM_USERID
      format: html
      message: | 
        ✅ <b>{{repo.name}}</b> Build <b>#{{build.number}}</b> Başarılı!
        
        <a href='{{build.link}}'>🔗 Detaylar</a>
    when:
      status: [ success ]

  notify-failure:
    name: Send Build Fail Notification
    image: appleboy/drone-telegram
    settings:
      token:
        from_secret: TELEGRAM_TOKEN
      to:
        from_secret: TELEGRAM_USERID
      format: html
      message: | 
        ⚠️ <b>{{repo.name}}</b> Build <b>#{{build.number}}</b> Hata Aldı!
        
        <a href='{{build.link}}'>🔗 Detaylar</a>
    when:
      status: [ failure ]